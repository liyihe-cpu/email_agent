services:
  creator-pass:
    build:
      context: ../..
      dockerfile: deploy/h5/Dockerfile
    container_name: coojoy-creator-pass
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
