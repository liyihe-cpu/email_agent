[project]
name = "creator-mail-platform"
version = "0.1.0"
description = "Isolated bulk creator email validation and reply monitoring service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dnspython>=2.7",
    "email-validator>=2.3",
    "fastapi>=0.115",
    "openai>=1.60,<3",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pymilvus>=2.5",
    "rich>=13.9,<15",
    "sqlalchemy>=2.0",
    "typer>=0.20,<1",
    "uvicorn>=0.30",
]

[project.scripts]
creator-mail = "creator_mail_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_mail_platform"]
